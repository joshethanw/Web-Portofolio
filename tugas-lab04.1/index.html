<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
    }

    .container {
      width: 748px;
      height: 748px;
      display: grid;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 20px;
      gap: 9px;
      background-color: #000000;
    }

    .red {
      grid-area: 1 / 1 / 2 / 2;
      background-color: #E72F24;
    }

    .white-top {
      grid-area: 1 / 2 / 2 / 5;
      background-color: #F0F1EC;
    }

    .white-left {
      grid-area: 2 / 1 / 4 / 2;
      background-color: #F0F1EC;
    }

    .white-center {
      grid-area: 2 / 2 / 4 / 4;
      background-color: #F0F1EC;
    }

    .blue {
      grid-area: 2 / 4 / 3 / 5;
      background-color: #004592;
    }

    .white-right {
      grid-area: 3 / 4 / 5 / 5;
      background-color: #F0F1EC;
    }

    .yellow {
      grid-area: 4 / 2 / 5 / 3;
      background-color: #F9D01E;
    }

    .black {
      grid-area: 4 / 3 / 5 / 4;
      background-color: #232629;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="red"></div>
    <div class="white-top"></div>
    <div class="white-left"></div>
    <div class="white-center"></div>
    <div class="blue"></div>
    <div class="white-right"></div>
    <div class="yellow"></div>
    <div class="black"></div>
  </main>
</body>

</html>
